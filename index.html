<style>
:root{

  --paper:#F4F8FF; --card:#FFFFFF; --line:#D6DEF0;
  --K:#E63946; --U:#2B8CE6; --KU:#7B4FD6; --T:#1D2B53;
  --ok:#1F9D74; --ng:#D1495B;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);

@media (prefers-color-scheme: dark){

}
:root[data-theme="dark"]{ --ink:#E8EDFF; --ink2:#AEB8DA; --paper:#10172E; --card:#18213F; --line:#2C3860; --T:#C9D1EE; }
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--paper);color:var(--ink);font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Hiragino Sans","Yu Gothic",Meiryo,sans-serif;font-weight:500;line-height:1.65;-webkit-font-smoothing:antialiased}
button,input,select{font:inherit;color:inherit}

/* ---------- header / route ---------- */
header{max-width:1280px;margin:0 auto;padding:22px 20px 6px}
.title{display:flex;align-items:flex-end;gap:14px;flex-wrap:wrap}
h1{margin:0;font-weight:800;font-size:clamp(26px,4vw,40px);line-height:1.15;letter-spacing:.01em}
h1 .loop{display:inline-block;transform:translateY(-.05em)}
.tag{font-size:14px;color:var(--ink2);margin:0 0 4px}
.score{font-weight:800;font-size:15px;background:var(--yellow);color:#1D2B53;padding:4px 12px;border-radius:999px}
.tagrow{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between;margin:0 0 4px}
.tagrow .tag{margin:0}
.tools{display:flex;align-items:center;gap:8px;margin-left:auto}
.title .score{margin-left:auto}
.theme{border:2px solid var(--line);background:var(--card);border-radius:999px;width:38px;height:32px;color:var(--ink2);font-size:15px;line-height:1}
.langsw{display:flex;border:2px solid var(--line);border-radius:999px;overflow:hidden;background:var(--card)}
.langsw button{border:0;background:transparent;padding:4px 12px;font-size:13px;font-weight:700;color:var(--ink2)}
.langsw button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.route{position:relative;display:flex;gap:0;margin:18px 0 4px;overflow-x:auto;padding:6px 2px 10px}
.route::before{content:"";position:absolute;left:24px;right:24px;top:25px;height:6px;border-radius:3px;
  background:repeating-linear-gradient(90deg,var(--red) 0 14px,#b82835 14px 18px)}
.stop{position:relative;flex:1 0 118px;display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:none;padding:0 4px;text-align:center}
.stop .dot{width:30px;height:30px;border-radius:50%;background:var(--card);border:4px solid var(--red);display:grid;place-items:center;font-weight:800;font-size:14px;z-index:1}
.stop .nm{font-size:13px;font-weight:700;line-height:1.3;color:var(--ink2)}
.stop[aria-current="step"] .dot{background:var(--yellow);border-color:var(--ink);color:#1D2B53;transform:scale(1.15)}
.stop[aria-current="step"] .nm{color:var(--ink)}
.stop.done .dot{background:var(--red);color:#fff}

/* ---------- main grid ---------- */
main{max-width:1280px;margin:0 auto;padding:8px 20px 40px;display:grid;grid-template-columns:minmax(0,1fr) 380px;gap:20px;align-items:start}
@media (max-width:980px){ main{grid-template-columns:minmax(0,1fr)} }
@media (max-width:600px){ .scene{aspect-ratio:4/3} header,main{padding-left:12px;padding-right:12px} }
.panel{background:var(--card);border:2px solid var(--line);border-radius:18px;padding:16px}
.lead h2{margin:0 0 4px;font-size:22px;font-weight:800}
.lead p{margin:0;color:var(--ink2);max-width:62ch}

.scene{position:relative;margin-top:12px;border-radius:14px;overflow:hidden;border:3px solid var(--ink);background:#8fd0ff;aspect-ratio:16/9;min-height:240px;width:100%}
.scene canvas{position:absolute;inset:0;display:block;width:100%;height:100%}
.hud{position:absolute;left:10px;top:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
.hud span{background:rgba(29,43,83,.82);color:#fff;border-radius:8px;padding:2px 9px;font-size:13px;font-weight:700;font-variant-numeric:tabular-nums}
.result{min-height:1.6em;margin:10px 2px 0;font-weight:700}
.result.ok{color:var(--ok)} .result.ng{color:var(--ng)}

.play{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin-top:10px}
.btn{border:2px solid var(--ink);background:var(--card);border-radius:12px;padding:8px 16px;font-weight:800}

.seg{display:inline-flex;border:2px solid var(--ink);border-radius:12px;overflow:hidden}

.bars{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;align-items:end;height:190px;padding:0 4px;border-bottom:4px solid var(--ink);border-left:4px solid var(--ink)}

.bar.k i{background:var(--K)} .bar.u i{background:var(--U)} .bar.ku i{background:var(--KU)} .bar.t i{background:var(--T)}

.qnav{display:flex;gap:8px;justify-content:space-between;margin-top:12px;flex-wrap:wrap}
.preset{border:2px dashed var(--red);background:transparent;color:var(--red);border-radius:12px;padding:6px 12px;font-weight:800;margin-bottom:10px}

/* ---------- calc (stage 5) ---------- */
.calc{display:grid;grid-template-columns:auto 1fr auto;gap:6px 10px;align-items:center;margin-top:10px}
.calc label{font-weight:800}
.calc input{width:100%;padding:6px 10px;border:2px solid var(--line);border-radius:10px;background:var(--paper);font-variant-numeric:tabular-nums}
.calc input.ok{border-color:var(--ok)} .calc input.ng{border-color:var(--ng)}
.given{font-size:14px;background:var(--paper);border-radius:12px;padding:8px 12px;margin-top:10px}

/* ---------- design (stage 6) ---------- */
.palette{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{border:2px solid var(--ink);border-radius:999px;background:var(--card);padding:5px 12px;font-weight:700;font-size:14px}
.chip small{color:var(--red);margin-left:4px}
.parts{list-style:none;margin:8px 0 0;padding:0;display:flex;flex-wrap:wrap;gap:6px}
.parts li{display:flex;align-items:center;gap:4px;background:var(--paper);border:2px solid var(--line);border-radius:10px;padding:3px 4px 3px 10px;font-size:14px;font-weight:700}
.parts button{border:0;background:transparent;padding:2px 6px;border-radius:6px}
.parts button:hover{background:var(--line)}

.checks li::before{content:"・";color:var(--ink2)}

.namebox{width:100%;padding:6px 10px;border:2px solid var(--line);border-radius:10px;background:var(--paper)}

footer a{color:inherit}

</main>
<footer>
  <p class="model" data-i18n="model">モデルの簡略化：コースターは大きさのない物体として扱い、レールの摩擦は一定の大きさ、空気抵抗は速さの2乗に比例するとしています。ループでは頂上付近で速さが足りないとレールから離れて落ちます（ビー玉コースターと同じ条件）。g = 9.8 m/s²</p>
  <p class="credit"><span data-i18n="credit">制作：のざたん</span> ／ <a href="https://meetupsensei.com">meetupsensei.com</a> ／ <a href="https://github.com/nozatan530/roller-coaster-energy/blob/main/LICENSE">MIT License</a> ／ <a href="https://github.com/nozatan530/roller-coaster-energy">GitHub</a></p>
</footer>
<script>
// ===== Physics & track (shared) =====
const G = 9.8; let DRAG = 0.0003; // air resistance per unit mass (1/m)
function buildTrack(segs){
  const pts=[]; let x=0,y=0; const STEP=0.25;
  const push=(px,py,o)=>pts.push(Object.assign({x:px,y:py,mu:0.02,loop:false,brake:false},o||{}));
  const marks={};
  for(const sg of segs){
    const o={mu:sg.mu!=null?sg.mu:0.02,brake:!!sg.brake};
    if(sg.t==='start'){x=0;y=sg.h;push(x,y,o);}
    else if(sg.t==='mark'){marks[sg.name]=pts.length-1;}
    else if(sg.t==='flat'){const n=Math.max(1,Math.round(sg.L/STEP));for(let i=1;i<=n;i++)push(x+sg.L*i/n,y,o);x+=sg.L;}
    else if(sg.t==='drop'){const y0=y,n=Math.max(2,Math.round(sg.L/STEP));for(let i=1;i<=n;i++){const u=i/n;push(x+sg.L*u,y0+(sg.to-y0)*(1-Math.cos(Math.PI*u))/2,o);}x+=sg.L;y=sg.to;}
    else if(sg.t==='hill'){const y0=y,n=Math.max(2,Math.round(sg.L/STEP));const st0=pts.length;for(let i=1;i<=n;i++){const u=i/n;push(x+sg.L*u,y0+sg.H*(1-Math.cos(2*Math.PI*u))/2,o);}if(sg.top)marks[sg.top]=st0+Math.floor(n/2)-1;x+=sg.L;}
    else if(sg.t==='loop'){const r=sg.r,d=0.7*r,x0=x,y0=y,n=Math.max(40,Math.round(2*Math.PI*r/STEP));
      for(let i=1;i<=n;i++){const th=2*Math.PI*i/n;push(x0+r*Math.sin(th)+d*th/(2*Math.PI),y0+r*(1-Math.cos(th)),Object.assign({},o,{loop:true}));}
      x=x0+d;y=y0;}
  }
  // arc length
  let s=0; pts[0].s=0;
  for(let i=1;i<pts.length;i++){s+=Math.hypot(pts[i].x-pts[i-1].x,pts[i].y-pts[i-1].y);pts[i].s=s;}
  const N=pts.length;
  for(let i=0;i<N;i++){
    const a=pts[Math.max(0,i-1)],b=pts[Math.min(N-1,i+1)];
    const ds=b.s-a.s||1; pts[i].tx=(b.x-a.x)/ds; pts[i].ty=(b.y-a.y)/ds;
  }
  for(let i=0;i<N;i++){
    const a=pts[Math.max(0,i-1)],b=pts[Math.min(N-1,i+1)];
    const ds=b.s-a.s||1; pts[i].k=(pts[i].tx*(b.ty-a.ty)-pts[i].ty*(b.tx-a.tx))/ds;
  }
  let minX=1e9,maxX=-1e9,maxY=0;for(const p of pts){minX=Math.min(minX,p.x);maxX=Math.max(maxX,p.x);maxY=Math.max(maxY,p.y);}
  return {pts,L:s,marks,minX,maxX,maxY};
}
function sampleTrack(tr,s){
  const P=tr.pts; if(s<=0)return P[0]; if(s>=tr.L)return P[P.length-1];
  let lo=0,hi=P.length-1; while(hi-lo>1){const m=(lo+hi)>>1; if(P[m].s<=s)lo=m; else hi=m;}
  const a=P[lo],b=P[hi],f=(s-a.s)/((b.s-a.s)||1);
  return {x:a.x+(b.x-a.x)*f,y:a.y+(b.y-a.y)*f,tx:a.tx+(b.tx-a.tx)*f,ty:a.ty+(b.ty-a.ty)*f,k:a.k+(b.k-a.k)*f,mu:a.mu,loop:a.loop&&b.loop,brake:a.brake};
}
function newState(tr,m,v0){
  let i0=0; if(!(v0>0)){ while(i0<tr.pts.length-1 && Math.abs(tr.pts[i0].ty)<=tr.pts[i0].mu+0.01) i0++; }
  const p0=tr.pts[i0];
  return {s:p0.s,s0:p0.s,u:v0||0,m,T:0,E0:m*G*p0.y+0.5*m*(v0||0)**2,status:'ready',t:0,fall:null,maxSpeed:0};
}
function stepSim(tr,st,dt){
  if(st.status==='fall'){const f=st.fall;f.vy-=G*dt;f.x+=f.vx*dt;f.y+=f.vy*dt;if(f.y<=0){f.y=0;st.status='crash';}st.t+=dt;return;}
  if(st.status!=='run')return;
  st.t+=dt;
  const p=sampleTrack(tr,st.s); let u=st.u;
  if(u===0){ if(Math.abs(p.ty)<=p.mu+1e-9){ // cannot start moving
      st.T=st.E0-st.m*G*p.y; st.status='stopped'; return; } }
  const dir=u!==0?Math.sign(u):-Math.sign(p.ty);
  const a=-G*p.ty-dir*p.mu*G-dir*DRAG*u*u;
  let un=u+a*dt;
  if(u!==0&&Math.sign(un)!==Math.sign(u)){ if(Math.abs(p.ty)<=p.mu) un=0; }
  if(u===0&&Math.sign(un)!==dir) un=0;
  const ds=(u+un)/2*dt; const sPrev=st.s; let sN=sPrev+ds;
  if(sN>=tr.L){st.s=tr.L;st.u=0;st.T=st.E0-st.m*G*tr.pts[tr.pts.length-1].y;st.status='end';return;}
  if(sN<=0){sN=0;un=0;}
  const pn=sampleTrack(tr,sN);
  const Tn=st.T+(pn.mu*G+DRAG*u*u)*st.m*Math.abs(ds);
  const ke=st.E0-Tn-st.m*G*pn.y;
  if(ke<=0){ st.u=0; return; } // turnaround: stay
  st.s=sN; st.T=Tn;
  if(un===0){ st.T=st.E0-st.m*G*pn.y; st.u=0; return; }

}

  if(st.status==='fall'||st.status==='crash'){const f=st.fall;const U=st.m*G*f.y,K=0.5*st.m*(f.vx*f.vx+f.vy*f.vy);return {K,U,T:st.T};}
  const p=sampleTrack(tr,st.s);const U=st.m*G*p.y;const K=0.5*st.m*st.u*st.u;return {K,U,T:st.T};
}

let LANG='ja';
try{LANG=localStorage.getItem('rc-energy-lab-lang')||'ja';}catch(e){}
if(LANG!=='ja'&&LANG!=='en')LANG='ja';
const msg=k=>UI[LANG][k];
const locCache={};
function loc(st){
  if(LANG!=='en')return st;
  if(locCache[st.id])return locCache[st.id];
  const e=EN_STAGES[st.id];
  return locCache[st.id]=Object.assign({},st,{short:e.short,title:e.title,lead:e.lead,
    controls:st.controls.map(c=>{const ec=e.controls[c.id]||{};return Object.assign({},c,{label:ec.label||c.label,note:ec.note||c.note,
      options:c.options&&c.options.map((o,i)=>Object.assign({},o,{l:(ec.options||[])[i]||o.l}))});}),
    quiz:st.quiz.map((q,i)=>Object.assign({},q,e.quiz[i])),
    points:st.points&&st.points.map((p,i)=>Object.assign({},p,{txt:e.points[i]||p.txt}))});
}
const cur=()=>loc(STAGES[stageIdx]);

// ===== App =====
const $=id=>document.getElementById(id);
const reduceMotion=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
const STORE='rc-energy-lab-v1';
let saved={stage:0,answers:{},params:{},parts:[],name:''};
try{const s=JSON.parse(localStorage.getItem(STORE)||'null');if(s)saved=Object.assign(saved,s);}catch(e){}
function persist(){try{localStorage.setItem(STORE,JSON.stringify(saved));}catch(e){}}

let stageIdx=Math.min(saved.stage||0,STAGES.length-1);
let params={}, track=null, sim=null, running=false, speed=2, hist=[], histT=0;
let calcPoint=0, calcVals={}, qIdx=0;

// ---------- route ----------
function renderRoute(){
  const r=$('route');r.innerHTML='';
  STAGES.forEach((st0,i)=>{
    const st=loc(st0);
    const b=document.createElement('button');b.className='stop';
    const ans=saved.answers[st.id]||{};const n=Object.keys(ans).length;
    if(n>=st.quiz.length)b.classList.add('done');
    if(i===stageIdx)b.setAttribute('aria-current','step');
    b.innerHTML=`<span class="dot">${i+1}</span><span class="nm">${st.short}</span>`;
    b.onclick=()=>gotoStage(i);r.appendChild(b);
  });
  let c=0;for(const k in saved.answers)for(const q in saved.answers[k])if(saved.answers[k][q])c++;
  let tot=0;STAGES.forEach(s=>tot+=s.quiz.length);
  $('score').textContent=msg('score')(c,tot);
}

// ---------- controls ----------
function fmt(v,unit){return unit==='m'||unit==='kg'||unit==='%'||unit==='m/s'?`${v} ${unit}`:(+v).toFixed(1);}
function renderControls(){
  const st=cur(),box=$('controls');box.innerHTML='';
  const sp=saved.params[st.id]||{};
  params={};
  for(const c of st.controls){
    params[c.id]=sp[c.id]!=null?sp[c.id]:c.value;
    const d=document.createElement('div');d.className='ctl';
    if(c.type==='range'){
      d.innerHTML=`<label for="c_${c.id}"><span>${c.label}</span><output id="o_${c.id}">${fmt(params[c.id],c.unit)}</output></label>
      <input type="range" id="c_${c.id}" min="${c.min}" max="${c.max}" step="${c.step}" value="${params[c.id]}">${c.note?`<div class="note">${c.note}</div>`:''}`;
      d.querySelector('input').oninput=e=>{params[c.id]=+e.target.value;$('o_'+c.id).textContent=fmt(params[c.id],c.unit);onParams();};
    }else{
      d.innerHTML=`<label><span>${c.label}</span></label><div class="seg" role="group" aria-label="${c.label}" data-id="${c.id}"></div>`;
      const sg=d.querySelector('.seg');
      c.options.forEach(o=>{const b=document.createElement('button');b.textContent=o.l;b.dataset.v=o.v;
        b.setAttribute('aria-pressed',String(o.v)===String(params[c.id]));
        b.onclick=()=>{params[c.id]=o.v;sg.querySelectorAll('button').forEach(x=>x.setAttribute('aria-pressed',x===b));onParams();};
        sg.appendChild(b);});
    }
    box.appendChild(d);
  }
  if(st.design)params.parts=saved.parts.slice();
}
function setParams(p){
  const st=cur();
  for(const k in p){params[k]=p[k];
    const inp=$('c_'+k);if(inp){inp.value=p[k];const c=st.controls.find(c=>c.id===k);$('o_'+k).textContent=fmt(p[k],c.unit);}
    const c=st.controls.find(c=>c.id===k);
    if(c&&c.type==='seg'){document.querySelectorAll('#controls .seg').forEach(sg=>{if(sg.dataset.id===c.id)sg.querySelectorAll('button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v)===String(p[k])));});}
  }
  onParams();
}
function onParams(){
  const st=cur();const cp=Object.assign({},params);delete cp.parts;
  saved.params[st.id]=cp;persist();rebuild();
}

// ---------- track / sim ----------
function rebuild(){
  const st=cur();
  DRAG=st.noDrag&&st.noDrag(params)?0:0.0003;
  track=buildTrack(st.build(params));
  resetSim();
  if(st.design)renderDesign();
}
function resetSim(){
  const st=cur();
  sim=newState(track,st.mass(params),params.v0||0);
  running=false;hist=[];histT=0;sim.maxY2=0;sim.passedTop=false;
  $('btnGo').textContent=msg('go');
  setResult('');
  if(st.calc){placeCalc();}
  camera=null;
}
function placeCalc(){
  const st=cur();const pt=st.points[calcPoint];
  const idx=track.marks[pt.mark];sim.s=track.pts[idx].s;sim.u=0;
}
function setResult(t,cls){const r=$('result');r.textContent=t;r.className='result'+(cls?' '+cls:'');}

function judge(){
  const st=cur(),s=sim;const p=sampleTrack(track,s.s);
  if(st.design){renderDesign();return;}
  if(s.status==='crash'){setResult(msg('rCrash'),'ng');return;}
  if(s.status==='end'){ if(st.id==='friction'&&params.course==='pipe') setResult(msg('rPipeOut'),'ok');
    else setResult(msg('rOverrun'),'ng');return;}
  if(s.status!=='stopped')return;
  if(st.id==='hill'){ const top=track.pts[track.marks.hilltop].s;
    setResult(s.passedTop?msg('rHillOk'):msg('rHillNg'),s.passedTop?'ok':'ng');return;}
  if(st.id==='friction'&&params.course==='pipe'){setResult(msg('rPipe')(s.maxY2.toFixed(1)),'');return;}
  if(st.design){renderDesign();return;}
  if(p.brake) setResult(msg('rDone'),'ok');
  else setResult(msg('rMid'),'');
}

// ---------- canvas ----------
const cv=$('cv'),ctx=cv.getContext('2d');let W=0,H=0,DPR=1,bgCache=null,camera=null;
function resize(){
  const r=cv.getBoundingClientRect();DPR=Math.min(2,window.devicePixelRatio||1);
  W=r.width;H=r.height;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);bgCache=null;camera=null;
  const ch=$('chart');const cr=ch.getBoundingClientRect();ch.width=Math.round(cr.width*DPR);ch.height=Math.round(cr.height*DPR);
}
function getCam(){
  if(camera)return camera;
  const ground=H-30, pad=24;
  const minX=track.minX-6,maxX=track.maxX+6,maxY=Math.max(track.maxY,20)*1.12+3;
  const sc=Math.min((W-pad*2)/(maxX-minX),(ground-pad)/maxY);
  const ox=(W-(maxX-minX)*sc)/2-minX*sc;
  camera={sc,ox,ground};return camera;
}
function toS(x,y){const c=getCam();return [c.ox+x*c.sc,c.ground-y*c.sc];}
function drawBg(){

let cloudT=0;

function drawTrack(){
  const P=track.pts,c=getCam();
  // supports
  ctx.lineWidth=2;ctx.strokeStyle='#E8ECF6';
  let prev=null;
  for(let i=0;i<P.length;i+=20){const p=P[i];
    if(p.loop&&p.y>0.3){prev=null;continue;}
    if(p.y<0.6){prev=null;continue;}
    const [x,y]=toS(p.x,p.y);ctx.beginPath();ctx.moveTo(x,y+4);ctx.lineTo(x,c.ground);ctx.stroke();
    if(prev&&Math.abs(prev[0]-x)<60){ctx.save();ctx.globalAlpha=.6;ctx.lineWidth=1;ctx.beginPath();
      ctx.moveTo(prev[0],prev[1]+4);ctx.lineTo(x,c.ground);ctx.moveTo(x,y+4);ctx.lineTo(prev[0],c.ground);ctx.stroke();ctx.restore();}
    prev=[x,y];}
  // loop supports
  // rail underside
  const path=()=>{ctx.beginPath();P.forEach((p,i)=>{const [x,y]=toS(p.x,p.y);i?ctx.lineTo(x,y):ctx.moveTo(x,y);});};
  ctx.lineJoin='round';ctx.lineCap='round';
  path();ctx.strokeStyle='#1D2B53';ctx.lineWidth=8;ctx.stroke();
  path();ctx.strokeStyle='#E63946';ctx.lineWidth=3.5;ctx.stroke();
  // ties
  ctx.strokeStyle='#F4F8FF';ctx.lineWidth=1.5;
  for(let i=0;i<P.length;i+=6){const p=P[i];const [x,y]=toS(p.x,p.y);const nx=-p.ty,ny=p.tx;
    ctx.beginPath();ctx.moveTo(x-nx*3.5,y+ny*3.5);ctx.lineTo(x+nx*3.5,y-ny*3.5);ctx.stroke();}
  // brake zone
  ctx.lineWidth=5;ctx.setLineDash([6,6]);ctx.strokeStyle='#FFC93C';
  ctx.beginPath();let on=false;P.forEach(p=>{const [x,y]=toS(p.x,p.y);if(p.brake){on?ctx.lineTo(x,y):ctx.moveTo(x,y);on=true;}else on=false;});ctx.stroke();ctx.setLineDash([]);
  const bz=P.find(p=>p.brake);if(bz){const [x,y]=toS(bz.x,bz.y);label(msg('brakeZone'),x+4,y-14,'#1D2B53','#FFC93C');}
}
function label(t,x,y,fg,bg){ctx.font='700 12px "M PLUS Rounded 1c",sans-serif';const w=ctx.measureText(t).width+10;x=Math.max(4,Math.min(x,W-w-4));

const RIDERS=[['#F2C9A0','#3B2A20'],['#E0B089','#111'],['#F5D3B3','#C0772E']];
function drawCar(){
  let x,y,ang,v;
  if(sim.status==='fall'||sim.status==='crash'){const f=sim.fall;[x,y]=toS(f.x,f.y);ang=-Math.atan2(f.vy,f.vx)+(sim.t-f.t0||0)*3;v=Math.hypot(f.vx,f.vy);}

  const L=34,h=12;

    for(let i=0;i<3;i++){ctx.beginPath();ctx.moveTo(d*(L/2+4),-4+i*5);ctx.lineTo(d*(L/2+4+v*.9),-4+i*5);ctx.stroke();}}
  // riders

    if(v>12){ctx.strokeStyle=r[0];ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(rx-2,-h/2-6);ctx.lineTo(rx-4,-h/2-14);ctx.moveTo(rx+2,-h/2-6);ctx.lineTo(rx+4,-h/2-14);ctx.stroke();}
    ctx.fillStyle=r[0];ctx.beginPath();ctx.arc(rx,-h/2-5,4.2,0,Math.PI*2);ctx.fill();
    ctx.fillStyle=r[1];ctx.beginPath();ctx.arc(rx,-h/2-6.5,4.2,Math.PI,0);ctx.fill();});
  // body
  ctx.fillStyle='#FFC93C';ctx.strokeStyle='#1D2B53';ctx.lineWidth=2;roundRect(-L/2,-h/2,L,h,5);ctx.fill();ctx.stroke();
  ctx.fillStyle='#E63946';ctx.beginPath();ctx.moveTo(L/2-2,-h/2);ctx.lineTo(L/2+6,h/2-2);ctx.lineTo(L/2-2,h/2);ctx.closePath();ctx.fill();ctx.stroke();
  ctx.fillStyle='#1D2B53';for(const wx of [-L/2+7,L/2-7]){ctx.beginPath();ctx.arc(wx,h/2+1,3,0,Math.PI*2);ctx.fill();}
  ctx.restore();

  else if(sim.status==='fall')t=msg('bFall');

  if(t){ctx.font='800 14px "M PLUS Rounded 1c",sans-serif';const w=ctx.measureText(t).width+14;const bx=Math.min(Math.max(x-w/2,4),W-w-4),by=Math.max(y-54,6);
    ctx.fillStyle='#fff';ctx.strokeStyle='#1D2B53';ctx.lineWidth=2;roundRect(bx,by,w,24,10);ctx.fill();ctx.stroke();ctx.fillStyle='#1D2B53';ctx.fillText(t,bx+7,by+17);}
}

    setBars(K,U,KU,T,E0);$('eqline').innerHTML=msg('eqCalc');const cp=st.points[calcPoint];$('hudH').textContent=msg('hudH')(cp.h.toFixed(1));$('hudV').textContent=msg('hudV')(cp.v.toFixed(1),(cp.v*3.6).toFixed(0));$('hudT').textContent=msg('pointN')(calcPoint+1);return;}

function drawChart(){

// ---------- loop ----------
let last=performance.now();
function frame(now){
  const dt=Math.min(.05,(now-last)/1000);last=now;if(!reduceMotion)cloudT+=dt;
  const st=cur();
  if(running&&!st.calc){
    const n=Math.ceil(dt*speed*480);const h=dt*speed/n;
    for(let i=0;i<n;i++){
      const prevStatus=sim.status,prevU=sim.u;stepSim(track,sim,h);
      if(st.id==='hill'&&!sim.passedTop&&!sim.toldBack&&prevU>0&&sim.u<=0&&sampleTrack(track,sim.s).y>5){sim.toldBack=true;setResult(msg('rHillBack')(sampleTrack(track,sim.s).y.toFixed(1)),'ng');}
      if(sim.status==='fall'&&prevStatus!=='fall')sim.fall.t0=sim.t;
      if(sim.status==='run'){const p=sampleTrack(track,sim.s);
        if(track.marks.hilltop!=null&&sim.s>track.pts[track.marks.hilltop].s+1)sim.passedTop=true;
        if(p.x>track.pts[Math.floor(track.pts.length/2)].x)sim.maxY2=Math.max(sim.maxY2,p.y);}
      if(sim.status!=='run'&&sim.status!=='fall')break;
    }
    if(sim.t-histT>=0.1){histT=sim.t;const e=energies(track,sim);hist.push({t:sim.t,K:e.K/sim.E0,U:e.U/sim.E0,T:e.T/sim.E0});if(hist.length>3000)hist.shift();}
    if(sim.status!=='run'&&sim.status!=='fall'){running=false;$('btnGo').textContent=msg('again');judge();}
  }
  draw();updateEnergy();drawChart();
  requestAnimationFrame(frame);
}

function renderDesign(){

function gotoStage(i){
  stageIdx=i;saved.stage=i;persist();qIdx=0;
  const st=loc(STAGES[i]);const ans=saved.answers[st.id]||{};
  while(qIdx<st.quiz.length&&ans[qIdx]!==undefined)qIdx++;
  if(qIdx>=st.quiz.length&&Object.keys(ans).length<st.quiz.length)qIdx=0;
  $('stTitle').textContent=st.title;$('stLead').textContent=st.lead;
  $('extra').innerHTML='';
  $('play').style.display=st.calc?'none':'';
  renderControls();rebuild();
  if(st.calc){calcPoint=0;placeCalc();renderCalc();}
  renderRoute();renderQuiz();
  resize();
}
// ---------- language / theme ----------
function applyLang(){
  document.documentElement.lang=LANG;document.title=msg('title');
  document.querySelectorAll('[data-i18n]').forEach(el=>el.textContent=msg(el.dataset.i18n));
  document.querySelectorAll('[data-i18n-aria]').forEach(el=>el.setAttribute('aria-label',msg(el.dataset.i18nAria)));
  $('themeBtn').setAttribute('aria-label',msg('themeLabel'));
  document.querySelectorAll('#langSw button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.lang===LANG));
}
$('langSw').addEventListener('click',e=>{
  const b=e.target.closest('[data-lang]');if(!b||b.dataset.lang===LANG)return;
  LANG=b.dataset.lang;try{localStorage.setItem('rc-energy-lab-lang',LANG);}catch(e){}
  applyLang();const q=qIdx,cp=calcPoint;gotoStage(stageIdx);
  qIdx=q;renderQuiz();
  if(cur().calc){calcPoint=cp;placeCalc();renderCalc();}
});
$('themeBtn').addEventListener('click',()=>{
  const root=document.documentElement;
  const dark=root.dataset.theme==='dark'||(!root.dataset.theme&&matchMedia('(prefers-color-scheme: dark)').matches);
  root.dataset.theme=dark?'light':'dark';
  try{localStorage.setItem('rc-energy-lab-theme',root.dataset.theme);}catch(e){}
});

window.addEventListener('resize',()=>{resize();});
if('ResizeObserver' in window)new ResizeObserver(()=>resize()).observe($('scene'));
applyLang();
gotoStage(stageIdx);
requestAnimationFrame(frame);

</script>
